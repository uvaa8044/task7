<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notebook App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 32px;
            color: #333;
        }

        .title p {
            color: #777;
            margin-top: 8px;
        }

        .input-box {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            outline: none;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea:focus {
            border-color: #555;
        }

        #count {
            position: absolute;
            right: 10px;
            bottom: 10px;
            color: #777;
            font-size: 13px;
        }

        #submitBtn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #submitBtn:hover {
            background-color: #555;
        }

        #notesContainer {
            margin-top: 30px;
        }

        .note {
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .note p {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .updateBtn,
        .deleteBtn {
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }

        .updateBtn {
            background-color: #555;
        }

        .updateBtn:hover {
            background-color: #333;
        }

        .deleteBtn {
            background-color: #d9534f;
        }

        .deleteBtn:hover {
            background-color: #c9302c;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 30px;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="title">
            <h1>Notebook App</h1>
            <p>Write and manage your notes</p>
        </div>


        <div class="input-box">

            <textarea
                id="noteInput"
                maxlength="500"
                placeholder="Write your note here..."></textarea>

            <span id="count">0 / 500</span>

        </div>


        <button id="submitBtn">Add Note</button>


        <div id="notesContainer"></div>


        <div class="footer">
            Your notes are saved here.
        </div>

    </div>


    <script>

        const noteInput =
            document.getElementById("noteInput");

        const count =
            document.getElementById("count");

        const submitBtn =
            document.getElementById("submitBtn");

        const notesContainer =
            document.getElementById("notesContainer");


        let notes = [];


        // Character count

        noteInput.addEventListener("input", function () {

            count.textContent =
                noteInput.value.length + " / 500";

        });


        // Load notes from database

        async function loadNotes() {

            const response =
                await fetch(
                    "http://127.0.0.1:8000/notes"
                );

            notes = await response.json();

            displayNotes();

        }


        // Add note

        submitBtn.addEventListener(
            "click",
            async function () {

                const noteText =
                    noteInput.value.trim();


                if (noteText === "") {

                    alert(
                        "Please write something first!"
                    );

                    return;

                }


                const response =
                    await fetch(
                        "http://127.0.0.1:8000/notes",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                content: noteText
                            })
                        }
                    );


                if (response.ok) {

                    noteInput.value = "";

                    count.textContent =
                        "0 / 500";

                    loadNotes();

                }

            }
        );


        // Display notes

        function displayNotes() {

            notesContainer.innerHTML = "";


            notes.forEach(function (note) {

                const noteDiv =
                    document.createElement("div");


                noteDiv.className = "note";


                noteDiv.innerHTML = `
                    <p>${note.content}</p>

                    <button
                        class="updateBtn"
                        onclick="updateNote(
                            ${note.id},
                            '${note.content.replace(/'/g, "\\'")}'
                        )">
                        Update
                    </button>

                    <button
                        class="deleteBtn"
                        onclick="deleteNote(${note.id})">
                        Delete
                    </button>
                `;


                notesContainer.appendChild(noteDiv);

            });

        }


        // Update note

        async function updateNote(id, oldContent) {

            const newContent =
                prompt(
                    "Edit your note:",
                    oldContent
                );


            if (newContent === null) {

                return;

            }


            if (newContent.trim() === "") {

                alert("Note cannot be empty!");

                return;

            }


            const response =
                await fetch(
                    `http://127.0.0.1:8000/notes/${id}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            content: newContent
                        })
                    }
                );


            if (response.ok) {

                loadNotes();

            }

        }


        // Delete note

        async function deleteNote(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this note?"
                );


            if (!confirmDelete) {

                return;

            }


            await fetch(
                `http://127.0.0.1:8000/notes/${id}`,
                {
                    method: "DELETE"
                }
            );


            loadNotes();

        }


        // Load database notes when page opens

        loadNotes();

    </script>

</body>

</html>
